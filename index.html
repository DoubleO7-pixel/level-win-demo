<style>

<script>
/* Themes = what changes per game. Personas = what changes per player. The engine never changes.
   Each theme lists celebration tiers (normal / daily_first / record). Add a game = add one theme object. */
window.LevelWinThemes = {
  calm_word: { // tone reference: calm word game (sunset, soft)
    backdrop: 'linear-gradient(#f6d9b0,#e59a7c)', text: '#4a2c2a', accent: '#c0467a', ctaText: '#fff', font: 'Georgia, serif',
    titleSize: 40, titleMs: 900, ease: 'cubic-bezier(.2,.8,.2,1)', radius: 24, shake: 0, cta: 'Collect', doubleCta: 'Collect x2 (video)', showSkipHint: true, adFatigueAfter: 3,
    sfx: { wave: 'sine', base: 392, vol: 0.12 }, // soft bell tones
    beats: { anticipate: 300, title: 1000, star: 450, tick: 40 },
    tiers: { normal: { headline: 'LEVEL COMPLETE', burst: 0.6 }, daily_first: { headline: 'First win of the day', burst: 0.8 }, record: { headline: 'New best!', burst: 1 } },
    particles: { shape: 'circle', count: 50, size: 5, speed: 2.2, gravity: 0.03, fade: 0.008, colors: ['#ffe6a0', '#ffffff', '#f4b6c8'] },
  },
  loud_match3: { // tone reference: loud, high-energy match game
    backdrop: 'radial-gradient(#5b2bd6,#240a63)', text: '#fff', accent: '#ffcb1f', ctaText: '#2b1067', font: 'Impact, Arial Black, sans-serif',
    titleSize: 50, titleMs: 380, ease: 'cubic-bezier(.3,1.8,.5,1)', radius: 10, shake: 14, cta: 'NEXT!', doubleCta: 'x2 (video)', showSkipHint: false, adFatigueAfter: 3,
    sfx: { wave: 'square', base: 523.25, vol: 0.06 }, // bright arcade tones
    beats: { anticipate: 120, title: 450, star: 280, tick: 25 },
    tiers: { normal: { headline: 'LEVEL COMPLETE!', burst: 1 }, daily_first: { headline: 'OFF TO A WIN!', burst: 1.2, size: 54 }, record: { headline: 'NEW RECORD!!', burst: 1.8, size: 58 } },
    particles: { shape: 'rect', count: 120, size: 7, speed: 9, gravity: 0.22, fade: 0.012, colors: ['#ff3d71', '#ffcb1f', '#3dd6ff', '#7dff6b', '#ffffff'] },
  },
  quick_puzzle: { // tone reference: story puzzle where ad/handoff speed matters; minimal celebration
    backdrop: 'linear-gradient(#fff3e0,#ffd9b3)', text: '#5a3a1a', accent: '#2fb67c', ctaText: '#fff', font: 'system-ui, sans-serif',
    titleSize: 34, titleMs: 300, ease: 'ease-out', radius: 14, shake: 0, cta: 'Next', doubleCta: 'Reward x2', showSkipHint: true, adFatigueAfter: 1,
    sfx: { wave: 'triangle', base: 659.25, vol: 0.1 }, // short, light blips
    beats: { anticipate: 100, title: 300, star: 200, tick: 20 },
    tiers: { normal: { headline: 'Solved!', burst: 0.4 }, daily_first: { headline: 'Solved! Daily bonus', burst: 0.6 }, record: { headline: 'Fastest yet!', burst: 0.8 } },
    particles: { shape: 'circle', count: 40, size: 5, speed: 3, gravity: 0.08, fade: 0.015, colors: ['#2fb67c', '#ffd24d', '#ffffff'] },
  },
};
window.LevelWinPersonas = {
  casual: { speed: 1 },         // full experience
  speedrunner: { speed: 0.5 }, // compressed beats, same content
  reduced_motion: { speed: 0.8 },
  kid: { speed: 1.2 },         // slightly longer, more particles feel
};

/* Level Win skill runtime. Framework-free; plug into any HTML/WebView game.
   LevelWin.play(host, input, opts) -> Promise<output>. Contract: contract.schema.json, SKILL.md.
   The skill never grants rewards, shows ads or navigates: it plays the moment and reports back. */
(function (g) {
  'use strict';
  const PARTICLE_MULT = { high: 1, mid: 0.45, low: 0 };
  const SKIP_LOCK_MS = 350;
  const SHARED = { ac: null, out: null };

  // Sound effects: small Web Audio synth, no asset files. A game with its own audio manager passes
  // opts.sfx(event, data); the skill then plays nothing itself and just calls the hook.
  function createSfx(theme, on, custom) {
    const cfg = theme.sfx || { wave: 'sine', base: 523.25, vol: 0.1 };
    const ctx = () => {
      if (!on) return null;
      let ac = SHARED.ac; // one AudioContext for the whole page, reused across wins
      if (!ac) { try { ac = SHARED.ac = new (g.AudioContext || g.webkitAudioContext)(); } catch (e) { on = false; return null; } }
      if (!SHARED.out) { // compressor + master gain: phone speakers are quiet, so lift the level without clipping
        const comp = ac.createDynamicsCompressor(), master = ac.createGain();
        master.gain.value = 3.2; comp.connect(master); master.connect(ac.destination); SHARED.out = comp;
      }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    };
    const n = (semi) => cfg.base * Math.pow(2, semi / 12);
    function tone(f, dur, o) {
      o = o || {}; const c = ctx(); if (!c) return;
      const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), gain = c.createGain();
      osc.type = o.type || cfg.wave; osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime((o.vol || 1) * cfg.vol, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(SHARED.out); osc.start(t); osc.stop(t + dur + 0.03);
    }
    const route = (event, data, fn) => { if (custom) { try { custom(event, data || {}); } catch (e) { /* game audio must not break the skill */ } return; } try { fn(); } catch (e) { /* audio failure is never fatal */ } };
    return {
      beat(name, tier) { route('beat:' + name, { tier }, () => {
        if (name === 'anticipate') tone(n(-12), 0.28, { to: n(0), vol: 0.6 });
        if (name === 'headline') {
          const chord = tier === 'record' ? [0, 4, 7, 12, 16, 19] : tier === 'daily_first' ? [0, 4, 7, 12, 16] : [0, 4, 7, 12];
          chord.forEach((s, i) => tone(n(s), 0.5 + i * 0.04, { at: i * 0.07 }));
          if (tier !== 'normal') tone(n(24), 0.7, { at: chord.length * 0.07, vol: 0.6 });
        }
        if (name === 'progress') tone(n(0), 0.5, { to: n(12), vol: 0.6 });
      }); },
      star(i) { route('star', { index: i }, () => { const s = [4, 7, 12][i] || 12; tone(n(s), 0.35, { vol: 0.9 }); tone(n(s + 12), 0.2, { at: 0.04, vol: 0.4 }); }); },
      tick(i) { route('tick', { index: i }, () => { if (i % 2 === 0) tone(n(12 + ((i / 2) % 6) * 2), 0.06, { type: 'triangle', vol: 0.5 }); }); },
      coins() { route('coins', {}, () => [0, 3, 7, 12].forEach((s, i) => tone(n(19 + s), 0.12, { at: i * 0.06, vol: 0.5 }))); },
      pop() { route('pop', {}, () => tone(n(7), 0.12, { to: n(12), vol: 0.8 })); },
      skip() { route('skip', {}, () => tone(n(12), 0.18, { to: n(-5), vol: 0.6 })); },
    };
  }

  function detectTier() {
    if (g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve('low');
    return new Promise((res) => {
      let n = 0; const t0 = performance.now();
      (function f() {
        if (++n < 24) return requestAnimationFrame(f);
        const fps = n / ((performance.now() - t0) / 1000);
        res(fps > 50 ? 'high' : fps > 35 ? 'mid' : 'low');
      })();
    });
  }

  function validate(input, theme) {
    const errs = [];
    if (!input || typeof input !== 'object') return ['input missing'];
    if (!theme) errs.push('unknown themeId: ' + input.themeId);
    if (!['normal', 'daily_first', 'record'].includes(input.winTier || 'normal')) errs.push('winTier invalid');
    if (input.stars != null && !(input.stars >= 0 && input.stars <= 3)) errs.push('stars must be 0-3');
    return errs;
  }

  function el(tag, text, css) { const e = document.createElement(tag); if (text) e.textContent = text; e.style.cssText = css || ''; return e; }
  // A reward icon can be text/emoji or a 'data:image/...' URI (e.g. a gold coin drawn as SVG).
  function iconNode(ic) {
    if (ic && ic.indexOf('data:image') === 0) { const i = new Image(); i.src = ic; i.alt = ''; i.style.cssText = 'width:1.15em;height:1.15em;vertical-align:-0.2em'; return i; }
    return document.createTextNode(ic || '');
  }

  async function play(host, input, opts = {}) {
    const themes = opts.themes || g.LevelWinThemes, personas = opts.personas || g.LevelWinPersonas;
    const theme = themes[input && input.themeId];
    const emit = (name, data) => { try { opts.onEvent && opts.onEvent(name, Object.assign({ gameId: input && input.gameId, level: input && input.level }, data || {})); } catch (e) { /* analytics must never break the game */ } };
    const errs = validate(input, theme);
    if (errs.length) { emit('error', { errs }); return { status: 'invalid_input', errors: errs, rewardsGranted: false, choice: null, durationMs: 0 }; }

    const winTier = input.winTier || 'normal';
    const persona = personas[input.persona || 'casual'] || personas.casual;
    const adsSeen = (input.session && input.session.adsSeen) || 0;
    let perf = opts.perfTier && opts.perfTier !== 'auto' ? opts.perfTier : await detectTier();
    const tierCfg = theme.tiers[winTier] || theme.tiers.normal;
    const fatigue = adsSeen >= (theme.adFatigueAfter || 3) ? 0.6 : 1; // compress optional beats when player is ad-fatigued
    const speed = persona.speed * fatigue * (perf === 'low' ? 1.3 : 1);
    const sfx = createSfx(theme, opts.sound !== false, opts.sfx);
    const t0 = performance.now();
    const ctl = { skipped: !!opts.instant, cancelled: false, beat: null, beats: [], choice: null };

    // ---- DOM
    const root = el('div', '', `position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:${theme.backdrop};font-family:${theme.font};color:${theme.text};overflow:hidden;opacity:0;transition:opacity .25s;touch-action:manipulation`);
    root.setAttribute('role', 'dialog'); root.setAttribute('aria-live', 'polite'); root.setAttribute('aria-label', tierCfg.headline);
    const canvas = el('canvas', '', 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
    const headline = el('div', tierCfg.headline, `font-size:${tierCfg.size || theme.titleSize}px;font-weight:800;transform:scale(.6);opacity:0;transition:all ${theme.titleMs}ms ${theme.ease};text-align:center;padding:0 16px`);
    const stars = el('div', '', 'display:flex;gap:10px;font-size:44px;min-height:54px');
    const bar = el('div', '', 'width:60%;height:12px;border-radius:8px;background:rgba(128,128,128,.25);overflow:hidden;opacity:0;transition:opacity .3s');
    const fill = el('div', '', `height:100%;width:0;background:${theme.accent};transition:width .6s ease`); bar.append(fill);
    const rewards = el('div', '', 'display:flex;gap:18px;min-height:36px;font-size:22px;font-weight:700');
    const row = el('div', '', 'display:flex;gap:10px;margin-top:8px;opacity:0;pointer-events:none;transition:opacity .3s');
    const cta = el('button', theme.cta, `padding:12px 30px;border:0;border-radius:${theme.radius}px;background:${theme.accent};color:${theme.ctaText};font-size:18px;font-weight:700;cursor:pointer`);
    const dbl = el('button', theme.doubleCta || 'Collect x2', `padding:12px 20px;border:2px solid ${theme.accent};border-radius:${theme.radius}px;background:transparent;color:${theme.text};font-size:16px;font-weight:700;cursor:pointer;display:${input.canDoubleReward ? 'block' : 'none'}`);
    row.append(dbl, cta);
    const hint = el('div', theme.showSkipHint ? 'TAP TO SKIP' : '', 'position:absolute;bottom:14px;font-size:12px;letter-spacing:2px;opacity:.55');
    root.append(canvas, headline, stars, bar, rewards, row, hint);
    host.append(root); requestAnimationFrame(() => (root.style.opacity = 1));

    // ---- particles (with live downgrade if frames drop)
    const ctx = canvas.getContext('2d'); const dpr = Math.min(g.devicePixelRatio || 1, 2);
    canvas.width = host.clientWidth * dpr; canvas.height = host.clientHeight * dpr;
    let parts = [], raf = 0, shake = 0, lastT = performance.now(), slowFrames = 0, spawnMult = PARTICLE_MULT[perf];
    function burst(scale = 1) {
      const n = Math.round(theme.particles.count * tierCfg.burst * scale * spawnMult);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.283, s = theme.particles.speed * (0.4 + Math.random());
        parts.push({ x: canvas.width / 2, y: canvas.height * 0.4, vx: Math.cos(a) * s * dpr, vy: Math.sin(a) * s * dpr - 2 * dpr, r: theme.particles.size * (0.6 + Math.random()) * dpr, life: 1, rot: Math.random() * 6, c: theme.particles.colors[i % theme.particles.colors.length] });
      }
      if (theme.shake && spawnMult > 0) shake = theme.shake * tierCfg.burst;
    }
    function frame(now) {
      const dt = now - lastT; lastT = now;
      if (dt > 40 && ++slowFrames > 12 && perf !== 'low') { perf = perf === 'high' ? 'mid' : 'low'; spawnMult = PARTICLE_MULT[perf]; slowFrames = 0; if (!spawnMult) parts = []; emit('perf_downgrade', { to: perf }); }
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
      if (shake > 0.5) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.9; }
      parts = parts.filter((p) => p.life > 0);
      for (const p of parts) {
        p.vy += theme.particles.gravity * dpr; p.x += p.vx; p.y += p.vy; p.rot += 0.1; p.life -= theme.particles.fade;
        ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        if (theme.particles.shape === 'rect') ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.3); ctx.fill(); }
        ctx.restore();
      }
      ctx.restore(); raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    // ---- reward fly-to-target cascade (staggered tokens to a HUD element the game provides)
    function fly(reward, fromEl) {
      const target = opts.targets && opts.targets[reward.id];
      if (!target || perf === 'low' || ctl.skipped) return;
      const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect(), n = Math.min(8, Math.max(3, Math.round(reward.amount / 20)));
      for (let i = 0; i < n; i++) {
        const t = el('div', '', `position:fixed;left:${a.left + a.width / 2}px;top:${a.top}px;font-size:22px;z-index:9999;pointer-events:none`);
        t.append(iconNode(reward.icon || '•'));
        document.body.append(t);
        const an = t.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${b.left - a.left}px,${b.top - a.top}px) scale(.6)`, opacity: .9 }], { duration: 600, delay: i * 70, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
        an.onfinish = () => t.remove();
      }
    }

    // ---- control
    const wait = (ms) => new Promise((res) => { if (ctl.skipped) return res(); const t = setTimeout(res, ms * speed); ctl.wake = () => { clearTimeout(t); res(); }; });
    const check = () => { if (ctl.cancelled) throw new Error('interrupted'); };
    const beat = async (name, fn) => { check(); ctl.beat = name; ctl.beats.push(name); emit('beat', { name, perf }); if (!ctl.skipped) sfx.beat(name, winTier); await fn(); check(); };
    root.addEventListener('pointerdown', (e) => {
      if (row.contains(e.target)) return;
      if (performance.now() - t0 > SKIP_LOCK_MS && !ctl.skipped) { ctl.skipped = true; emit('skip', { at: ctl.beat, ms: Math.round(performance.now() - t0) }); sfx.skip(); ctl.wake && ctl.wake(); hint.remove(); }
    });
    const cancel = (reason) => { if (ctl.cancelled) return; ctl.cancelled = true; ctl.reason = reason; ctl.wake && ctl.wake(); };
    if (opts.signal) { if (opts.signal.aborted) cancel('abort'); else opts.signal.addEventListener('abort', () => cancel('abort')); }
    const onVis = () => document.hidden && cancel('backgrounded');
    document.addEventListener('visibilitychange', onVis);
    emit('start', { themeId: input.themeId, persona: input.persona || 'casual', winTier, perf, adsSeen, instant: !!opts.instant });

    let status = 'completed';
    try {
      await beat('anticipate', () => wait(theme.beats.anticipate));
      await beat('headline', async () => { headline.style.transform = 'scale(1)'; headline.style.opacity = 1; burst(); await wait(theme.beats.title); });
      if (input.stars != null) await beat('stars', async () => {
        for (let i = 0; i < 3; i++) { stars.append(el('span', i < input.stars ? '★' : '☆', `color:${i < input.stars ? theme.accent : 'rgba(128,128,128,.4)'}`)); if (i < input.stars) { burst(0.5); if (!ctl.skipped) sfx.star(i); } await wait(theme.beats.star); }
      });
      if (input.progress) await beat('progress', async () => { bar.style.opacity = 1; fill.style.width = (100 * input.progress.from / input.progress.max) + '%'; await wait(120); fill.style.width = (100 * input.progress.to / input.progress.max) + '%'; await wait(650); });
      await beat('rewards', async () => {
        for (const r of input.rewards || []) {
          const c = el('div', '', ''); rewards.append(c);
          const label = (v) => c.replaceChildren(iconNode(r.icon), document.createTextNode(' +' + v));
          if (ctl.skipped) label(r.amount);
          else { for (let s = 1; s <= 12 && !ctl.skipped; s++) { label(Math.round(r.amount * s / 12)); sfx.tick(s); await wait(theme.beats.tick); } label(r.amount); fly(r, c); if (!ctl.skipped) sfx.coins(); }
        }
      });
      await beat('cta', async () => {
        row.style.opacity = 1; row.style.pointerEvents = 'auto'; hint.remove();
        await new Promise((res) => {
          ctl.wake = () => res();
          cta.onclick = () => { ctl.choice = 'continue'; sfx.pop(); res(); };
          dbl.onclick = () => { ctl.choice = 'double'; sfx.pop(); res(); };
          if (opts.autoContinueMs) setTimeout(() => { ctl.choice = ctl.choice || 'auto'; res(); }, opts.autoContinueMs);
        });
      });
    } catch (e) { status = 'interrupted'; }
    if (status === 'completed' && ctl.skipped) status = 'skipped';
    cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVis);
    root.style.opacity = 0; setTimeout(() => root.remove(), 260);
    const out = { status, reason: ctl.reason || null, winTier, skipped: ctl.skipped, perfTier: perf, beatsPlayed: ctl.beats, lastBeat: ctl.beat, choice: ctl.choice, durationMs: Math.round(performance.now() - t0), rewardsGranted: false /* the game grants rewards, always, whatever the status */, handoff: status === 'interrupted' ? 'show_static_result' : 'next_flow' };
    emit('end', out);
    return out;
  }
  g.LevelWin = { play, detectTier, validate };
})(window);

</script>
<script>
const $=id=>document.getElementById(id);let ac;
// Gold coin drawn as SVG so it renders gold everywhere (the coin emoji looks silver on some systems).
const GOLD_COIN='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><radialGradient id="g" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffc928"/><stop offset="1" stop-color="#d98d00"/></radialGradient></defs><circle cx="16" cy="16" r="14.5" fill="url(#g)" stroke="#b36b00" stroke-width="1.5"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff0a0" stroke-opacity=".85" stroke-width="1.6"/><path d="M16 9.5l2 4.2 4.6.6-3.4 3.2.9 4.6-4.1-2.3-4.1 2.3.9-4.6-3.4-3.2 4.6-.6z" fill="#fff6c8" stroke="#c98200" stroke-width=".8" stroke-linejoin="round"/></svg>');
$('hudcoin').src=GOLD_COIN;
function run(instant){
  $('cover').classList.add('gone');
  if(innerWidth<760)$('phone').scrollIntoView({block:'center',behavior:'smooth'});
  ac=new AbortController();$('log').textContent='';
  const input={gameId:'demo',level:12,themeId:$('theme').value,persona:$('persona').value,winTier:$('tier').value,stars:+$('stars').value,
    canDoubleReward:$('dbl').checked,session:{adsSeen:+$('ads').value},progress:{from:2,to:3,max:4},rewards:[{id:'coins',icon:GOLD_COIN,amount:120}]};
  return LevelWin.play($('phone'),input,{perfTier:$('perf').value,signal:ac.signal,instant,sound:$('snd').checked,targets:{coins:$('wallet')},
    onEvent:(n,d)=>$('log').textContent+=n+' '+JSON.stringify(d)+'\n'}).then(out=>{
      const gain=(out.choice==='double'?2:1)*120;$('wallet').textContent=+$('wallet').textContent+gain;
      $('log').textContent+='\nRESULT '+JSON.stringify(out,null,1)+'\ngame granted +'+gain+' coins';return out;});
}
$('play').onclick=()=>run(false);
$('intr').onclick=()=>ac&&ac.abort();
$('again').onclick=()=>run(true);
$('cover').onclick=()=>run(false);
</script>
